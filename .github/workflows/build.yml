name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/OpenDisplay.Core.Tests -c Release --logger "console;verbosity=normal"
      - name: Publish (self-contained, no .NET install needed)
        run: dotnet publish src/OpenDisplay.Windows -c Release -r win-x64 --self-contained true -o artifacts/OpenDisplayReceiver
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplayReceiver-win-x64
          path: artifacts/OpenDisplayReceiver
